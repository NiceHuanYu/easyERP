spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/EasyERP?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true

mybatis-plus:
  db-type: MYSQL
