spring:
  application:
    name: backend
  profiles:
    active: mysql    # 默认 MySQL；改 postgres 切换 PostgreSQL

# 应用配置
app:
  init:
    create-admin: true
    admin-password: ${ADMIN_INIT_PASSWORD:admin123}

server:
  port: 8080

# MyBatis-Plus
mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: random-64
  is-log: false

knife4j:
  enable: true
  setting:
    swagger-model-name: EasyERP API

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
